<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Chit — Restaurant Admin & POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Zilla+Slab:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  :root{
    --bg: #090d16;
    --panel: rgba(20, 27, 43, 0.75);
    --panel-raised: rgba(28, 38, 59, 0.85);
    --line: rgba(255, 255, 255, 0.08);
    --line-glow: rgba(245, 158, 11, 0.25);
    --brass: #f59e0b;
    --brass-dim: rgba(245, 158, 11, 0.15);
    --paper: #f8fafc;
    --paper-dim: #94a3b8;
    --sage: #818cf8;
    --rust: #ef4444;
    --rust-bg: rgba(239, 68, 68, 0.15);
    --leaf: #10b981;
    --leaf-bg: rgba(16, 185, 129, 0.15);
    --radius: 12px;
    --radius-sm: 8px;
    --radius-full: 9999px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:radial-gradient(circle at 50% 0%, #172033 0%, #090d16 80%); color:var(--paper); font-family:'Plus Jakarta Sans', sans-serif; min-height:100vh; overflow-x:hidden; }
  .app{ display:flex; min-height:100vh; }

  .sidebar{ width:250px; background:rgba(13, 18, 30, 0.9); backdrop-filter:blur(20px); border-right:1px solid var(--line); padding:24px 0; display:flex; flex-direction:column; flex-shrink:0; }
  .brand{ padding:0 22px 20px 22px; border-bottom:1px solid var(--line); margin-bottom:18px; }
  .brand-mark{ font-family:'Zilla Slab', serif; font-weight:700; font-size:24px; color:var(--brass); letter-spacing:0.5px; background:linear-gradient(135deg, #f59e0b, #fbbf24); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .brand-sub{ font-size:11px; color:var(--paper-dim); text-transform:uppercase; letter-spacing:1.5px; margin-top:2px; font-weight:700; }
  .who-box{ margin:0 20px 20px 20px; padding:12px 14px; background:var(--panel-raised); border:1px solid var(--line); border-radius:var(--radius-sm); font-size:12px; }
  .who-name{ font-weight:700; font-size:13px; color:var(--paper); }
  .who-role{ color:var(--paper-dim); text-transform:capitalize; font-size:11px; font-weight:500; }
  .logout-link{ background:none; border:none; color:var(--rust); font-size:11px; cursor:pointer; padding:0; margin-top:8px; font-weight:700; }
  nav{ position:relative; display:flex; flex-direction:column; gap:4px; padding:0 12px; }
  .nav-btn{ position:relative; z-index:2; display:flex; align-items:center; gap:10px; padding:12px 14px; background:none; border:none; color:var(--paper-dim); font-family:'Plus Jakarta Sans', sans-serif; font-size:14px; font-weight:600; text-align:left; border-radius:var(--radius-sm); cursor:pointer; transition: all 0.2s; width:100%; }
  .nav-btn:hover{ color:var(--paper); background:rgba(255, 255, 255, 0.04); }
  .nav-btn.active{ color:#000; background:linear-gradient(135deg, #f59e0b, #d97706); box-shadow:0 4px 14px var(--brass-dim); }
  .nav-num{ font-family:'Space Mono', monospace; font-size:11px; opacity:0.85; width:20px; }
  .nav-badge{ margin-left:auto; background:var(--rust); color:#fff; font-size:10px; font-weight:800; padding:2px 8px; border-radius:var(--radius-full); animation: pulseBadge 1.6s ease-in-out infinite; }
  .nav-highlight{ display:none; }
  @keyframes pulseBadge{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.15); } }

  main{ flex:1; padding:36px 44px; max-width:1300px; }
  .page-fade{ animation: fadeSlideIn 0.32s cubic-bezier(.16,1,.3,1); }
  @keyframes fadeSlideIn{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:translateY(0); } }

  .page-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:30px; flex-wrap:wrap; gap:14px; }
  .page-title{ font-family:'Zilla Slab', serif; font-size:32px; font-weight:700; color:var(--paper); letter-spacing:-0.5px; }
  .page-sub{ color:var(--paper-dim); font-size:13px; margin-top:4px; font-weight:500; }
  .btn{ background:linear-gradient(135deg, var(--brass), #d97706); color:#000; border:none; padding:11px 20px; border-radius:var(--radius-sm); font-family:'Plus Jakarta Sans', sans-serif; font-weight:800; font-size:13px; cursor:pointer; transition: all 0.2s; box-shadow:0 4px 14px var(--brass-dim); }
  .btn:hover{ filter:brightness(1.12); transform:translateY(-1px); }
  .btn:active{ transform:scale(0.96); }
  .btn.ghost{ background:var(--panel-raised); border:1px solid var(--line); color:var(--paper); box-shadow:none; }
  .btn.ghost:hover{ border-color:var(--brass); }
  .btn.danger{ background:linear-gradient(135deg, var(--rust), #dc2626); color:#fff; box-shadow:0 4px 14px rgba(239, 68, 68, 0.3); }
  .btn.small{ padding:7px 14px; font-size:12px; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none; filter:none; }

  .stat-row{ display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px; margin-bottom:32px; }
  .stat-card{ background:var(--panel); backdrop-filter:blur(16px); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; transition: all 0.2s; box-shadow:0 8px 24px rgba(0,0,0,0.25); }
  .stat-card:hover{ transform:translateY(-3px); border-color:var(--brass); box-shadow:0 12px 30px var(--brass-dim); }
  .stat-num{ font-family:'Zilla Slab', serif; font-size:32px; font-weight:700; color:var(--brass); background:linear-gradient(135deg, #f59e0b, #fbbf24); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .stat-label{ font-size:11px; color:var(--paper-dim); text-transform:uppercase; letter-spacing:1px; margin-top:6px; font-weight:700; }

  .panel{ background:var(--panel); backdrop-filter:blur(16px); border:1px solid var(--line); border-radius:var(--radius); padding:24px; margin-bottom:24px; box-shadow:0 8px 30px rgba(0,0,0,0.2); }
  .panel-title{ font-family:'Zilla Slab', serif; font-size:20px; font-weight:700; margin-bottom:16px; color:var(--paper); }
  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--paper-dim); padding:10px 12px; border-bottom:1px solid var(--line); font-weight:700;}
  td{ padding:12px; border-bottom:1px solid var(--line); font-size:14px; font-weight:500; }
  tbody tr{ transition: background 0.15s; }
  tbody tr:hover{ background:rgba(255, 255, 255, 0.03); }
  tr:last-child td{ border-bottom:none; }
  .pill{ padding:4px 12px; border-radius:var(--radius-full); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; display:inline-block;}
  .pill.on{ background:var(--leaf-bg); color:var(--leaf); border:1px solid rgba(16, 185, 129, 0.3); }
  .pill.off{ background:var(--rust-bg); color:var(--rust); border:1px solid rgba(239, 68, 68, 0.3); }
  .pill.wait{ background:var(--brass-dim); color:var(--brass); border:1px solid rgba(245, 158, 11, 0.3); }

  .form-row{ display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  input, select, textarea{ background:var(--panel-raised); border:1px solid var(--line); border-radius:var(--radius-sm); color:var(--paper); padding:11px 14px; font-family:'Plus Jakarta Sans', sans-serif; font-size:13px; transition: border-color 0.15s; }
  input:focus, select:focus{ outline:none; border-color:var(--brass); box-shadow:0 0 0 3px var(--brass-dim); }
  input::placeholder{ color:var(--paper-dim); }
  .search-input{ min-width:240px; }
  .icon-btn{ background:none; border:none; color:var(--paper-dim); cursor:pointer; font-size:14px; transition: color 0.15s; }
  .icon-btn:hover{ color:var(--rust); }
  .icon-btn.edit:hover{ color:var(--brass); }
  .filter-tabs{ display:flex; gap:8px; margin-bottom:18px; overflow-x:auto; }
  .filter-tab{ padding:8px 16px; border-radius:var(--radius-full); border:1px solid var(--line); background:var(--panel-raised); color:var(--paper-dim); font-size:12px; font-weight:700; cursor:pointer; transition:all 0.15s; white-space:nowrap; }
  .filter-tab.active{ background:var(--brass); color:#000; border-color:var(--brass); }

  .table-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(185px, 1fr)); gap:18px; }
  .chit{ position:relative; background:var(--panel-raised); border:1px solid var(--line); border-radius:var(--radius); padding:18px 16px;
    cursor:pointer; transition: all 0.2s; animation: cardIn 0.3s cubic-bezier(.16,1,.3,1) backwards; box-shadow:0 6px 18px rgba(0,0,0,0.2);
  }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(8px) scale(0.97); } to{ opacity:1; transform:translateY(0) scale(1); } }
  .chit:hover{ transform:translateY(-4px); border-color:var(--brass); box-shadow:0 12px 28px var(--brass-dim); }
  .chit.occupied{ border-color:rgba(239, 68, 68, 0.4); background:linear-gradient(180deg, rgba(239, 68, 68, 0.08) 0%, var(--panel-raised) 100%); }
  .chit.reserved{ border-color:rgba(245, 158, 11, 0.5); background:linear-gradient(180deg, rgba(245, 158, 11, 0.08) 0%, var(--panel-raised) 100%); }
  .chit-num{ font-family:'Space Mono', monospace; font-size:24px; font-weight:700; color:var(--paper); }
  .chit-cap{ font-size:11px; color:var(--paper-dim); margin-top:2px; font-weight:600; }
  .chit-status{ margin-top:14px; font-size:11px; text-transform:uppercase; letter-spacing:0.8px; font-weight:800; padding-top:12px; border-top:1px dashed var(--line); display:flex; align-items:center; gap:8px;}
  .status-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
  .chit.free .chit-status{ color:var(--leaf); } .chit.free .status-dot{ background:var(--leaf); box-shadow:0 0 8px var(--leaf); }
  .chit.occupied .chit-status{ color:var(--rust); } .chit.occupied .status-dot{ background:var(--rust); box-shadow:0 0 8px var(--rust); animation:blink 1.4s infinite; }
  .chit.reserved .chit-status{ color:var(--brass); } .chit.reserved .status-dot{ background:var(--brass); box-shadow:0 0 8px var(--brass); }
  @keyframes blink{ 0%,100%{ opacity:1;} 50%{ opacity:0.35;} }
  .chit-sub{ font-size:11px; color:var(--paper-dim); margin-top:4px; }
  .chit-actions{ margin-top:12px; display:flex; gap:6px; flex-wrap:wrap; }
  .empty{ color:var(--paper-dim); font-size:13px; padding:24px 0; text-align:center; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(4, 7, 13, 0.85); backdrop-filter:blur(10px); display:none; align-items:center; justify-content:center; z-index:100; padding:24px; }
  .modal-overlay.show{ display:flex; animation: overlayIn 0.18s ease; }
  @keyframes overlayIn{ from{ opacity:0;} to{opacity:1;} }
  .modal{ background:rgba(20, 27, 43, 0.95); border:1px solid var(--line); border-radius:var(--radius); width:100%; max-width:660px; max-height:88vh; overflow-y:auto; padding:28px; animation: modalIn 0.25s cubic-bezier(.16,1,.3,1); box-shadow:0 20px 50px rgba(0,0,0,0.6); }
  @keyframes modalIn{ from{ opacity:0; transform:translateY(14px) scale(0.98);} to{ opacity:1; transform:translateY(0) scale(1);} }
  .modal.wide{ max-width:780px; }
  .modal.narrow{ max-width:440px; }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid var(--line); padding-bottom:14px; }
  .modal-title{ font-family:'Zilla Slab', serif; font-size:22px; font-weight:700; color:var(--paper); }
  .close-x{ background:var(--panel-raised); border:1px solid var(--line); color:var(--paper-dim); width:32px; height:32px; border-radius:50%; font-size:16px; cursor:pointer; transition:all 0.15s; display:flex; align-items:center; justify-content:center; }
  .close-x:hover{ transform:rotate(90deg); color:var(--paper); border-color:var(--brass); }
  .menu-pick-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .menu-pick-name{ font-size:14px; font-weight:600; }
  .qty-ctrl{ display:flex; align-items:center; gap:8px; }
  .qty-ctrl button{ width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:var(--panel-raised); color:var(--paper); cursor:pointer; font-size:14px; font-weight:700; transition: transform 0.1s; }
  .qty-ctrl button:active{ transform:scale(0.85); }
  .qty-ctrl button:disabled{ opacity:0.4; cursor:not-allowed; }
  .qty-ctrl span{ font-family:'Space Mono', monospace; min-width:18px; text-align:center; display:inline-block; font-weight:700; }
  .order-total-bar{ display:flex; justify-content:space-between; align-items:center; padding-top:16px; margin-top:12px; border-top:1px solid var(--line); }
  .order-total-num{ font-family:'Zilla Slab', serif; font-size:24px; font-weight:700; color:var(--brass); }

  /* Invoice Modal Receipt styling */
  .invoice{ background:#fff; color:#1a1a1a; padding:22px; border-radius:var(--radius-sm); font-family:'Plus Jakarta Sans', sans-serif; margin-bottom:16px; border:1px solid var(--line); box-shadow:0 8px 24px rgba(0,0,0,0.3); }
  .invoice-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; padding-bottom:12px; border-bottom:2px solid #eee; }
  .invoice-brand{ font-family:'Zilla Slab', serif; font-size:24px; font-weight:700; color:#111; }
  .invoice-meta{ text-align:right; font-size:12px; color:#555; }
  .invoice table{ width:100%; border-collapse:collapse; margin-bottom:16px; }
  .invoice th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#666; padding:8px 0; border-bottom:1px solid #ddd; font-weight:700; }
  .invoice td{ padding:8px 0; font-size:13px; color:#222; border-bottom:1px solid #eee; font-weight:500; }
  .invoice-totals{ border-top:2px solid #eee; padding-top:12px; display:flex; flex-direction:column; gap:6px; }
  .invoice-totals div{ display:flex; justify-content:space-between; font-size:13px; color:#555; }
  .invoice-totals div.grand{ font-size:18px; font-weight:800; color:#111; padding-top:8px; border-top:1px solid #eee; }

  #toast-stack{ position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px; }
  .toast{ background:var(--panel-raised); border:1px solid var(--line); border-left:4px solid var(--brass); padding:14px 20px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; min-width:260px; box-shadow:0 10px 30px rgba(0,0,0,0.45); animation: toastIn 0.28s cubic-bezier(.16,1,.3,1); }
  .toast.success{ border-left-color: var(--leaf); }
  .toast.error{ border-left-color: var(--rust); }
  .toast.out{ animation: toastOut 0.22s ease forwards; }
  @keyframes toastIn{ from{ opacity:0; transform:translateX(40px);} to{ opacity:1; transform:translateX(0);} }
  @keyframes toastOut{ to{ opacity:0; transform:translateX(40px);} }

  /* login screen */
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .login-box{ background:var(--panel); backdrop-filter:blur(20px); border:1px solid var(--line); border-radius:var(--radius); padding:40px; width:100%; max-width:400px; animation:modalIn 0.3s cubic-bezier(.16,1,.3,1); box-shadow:0 20px 50px rgba(0,0,0,0.5); }
  .login-brand{ font-family:'Zilla Slab', serif; font-size:32px; font-weight:700; color:var(--brass); text-align:center; margin-bottom:4px; background:linear-gradient(135deg, #f59e0b, #fbbf24); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .login-sub{ text-align:center; color:var(--paper-dim); font-size:13px; margin-bottom:28px; font-weight:500; }
  .field-label{ font-size:12px; color:var(--paper-dim); margin-bottom:6px; display:block; font-weight:600; }
  .login-box input{ width:100%; margin-bottom:18px; }
  .login-error{ color:var(--rust); font-size:13px; margin-bottom:14px; min-height:16px; font-weight:600; }
</style>
</head>
<body>
<div id="root"></div>

<div class="modal-overlay" id="orderModalOverlay"><div class="modal wide" id="orderModal"></div></div>
<div class="modal-overlay" id="invoiceModalOverlay"><div class="modal wide" id="invoiceModal"></div></div>
<div class="modal-overlay" id="reservationModalOverlay"><div class="modal narrow" id="reservationModal"></div></div>
<div class="modal-overlay" id="confirmModalOverlay"><div class="modal narrow" id="confirmModal"></div></div>
<div id="toast-stack"></div>

<script>
/* ============================================================
   Config / auth state
============================================================ */
let API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:4000' : 'https://restaurant-billing-app-kp1p.onrender.com';
let authToken = null;
let currentUser = null;

let state = {
  menuItems: [],
  tables: [],
  waiters: [],
  orders: [],
  reservations: [],
  waiterReports: [],
  taxPct: 5,
};

let currentPage = "dashboard";
let draftOrder = null;
let menuFilter = { search:'', category:'all' };
let orderFilter = 'all';

function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function money(n){ return '₹' + Number(n).toFixed(2); }
const AVATAR_COLORS = ['#c89b3c','#6b9e78','#7e9187','#c1502e','#8ea3c8'];
function avatarColor(id){ return AVATAR_COLORS[id % AVATAR_COLORS.length]; }
function initials(name){ return (name||'Staff').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

function toast(msg, type='default'){
  const stack = document.getElementById('toast-stack');
  const t = el(`<div class="toast ${type}">${msg}</div>`);
  stack.appendChild(t);
  setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(), 220); }, 2800);
}

function confirmAction(message, onYes){
  const modal = document.getElementById('confirmModal');
  modal.innerHTML='';
  modal.appendChild(el(`<div>
    <div class="modal-title" style="margin-bottom:10px">Are you sure?</div>
    <div style="color:var(--paper-dim); font-size:13px; margin-bottom:20px;">${message}</div>
    <div class="form-row" style="justify-content:flex-end">
      <button class="btn ghost" id="cf-no">Cancel</button>
      <button class="btn danger" id="cf-yes">Confirm</button>
    </div>
  </div>`));
  document.getElementById('confirmModalOverlay').classList.add('show');
  modal.querySelector('#cf-no').onclick = ()=> document.getElementById('confirmModalOverlay').classList.remove('show');
  modal.querySelector('#cf-yes').onclick = ()=>{ document.getElementById('confirmModalOverlay').classList.remove('show'); onYes(); };
}

async function api(path, options={}){
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(authToken ? { 'Authorization': `Bearer ${authToken}` } : {}),
      ...(options.headers || {}),
    },
  });
  let data = {};
  try{ data = await res.json(); } catch(e){ data = {}; }
  if(!res.ok){ throw new Error(data.error || `Request failed (${res.status})`); }
  return data;
}

async function loadMenu(){
  const rows = await api('/api/menu');
  state.menuItems = rows.map(r => ({
    id: r.id, name: r.name, category: r.category_name || 'Uncategorized',
    price: Number(r.price), available: r.is_available,
  }));
}
async function loadTables(){
  const rows = await api('/api/tables');
  state.tables = rows.map(r => ({ id:r.id, number:r.table_number, capacity:r.capacity, status:r.status }));
}
async function loadWaiters(){
  const rows = await api('/api/waiters');
  state.waiters = rows.map(r => ({ id:r.id, name:r.name, email:r.email, active:r.is_active }));
}
async function loadReservations(){
  try {
    state.reservations = await api('/api/tables/reservations');
  } catch(e) { state.reservations = []; }
}
async function loadWaiterReports(){
  try {
    state.waiterReports = await api('/api/waiters/reports');
  } catch(e) { state.waiterReports = []; }
}
function tableNumberFor(tableId){
  const t = state.tables.find(t=>t.id===tableId);
  return t ? t.number : '?';
}

async function loadOrders(){
  const rows = await api('/api/orders');
  state.orders = rows.map(o => ({
    id: o.id,
    tableId: o.table_id,
    tableNumber: tableNumberFor(o.table_id),
    waiterId: o.waiter_id,
    customerName: o.customer_name,
    customerMobile: o.customer_mobile,
    waitingToken: o.waiting_token,
    orderType: o.order_type,
    status: o.status,
    taxPct: Number(o.tax_pct),
    discount: Number(o.discount),
    paymentMethod: o.payment_method || 'cash',
    createdAt: o.created_at,
    paidAt: o.paid_at,
    items: (o.items || []).map(it => ({
      orderItemId: it.id, menuItemId: it.menu_item_id, name: it.name, price: Number(it.price), qty: it.quantity,
    })),
  }));
}
async function loadInvoices(){
  try {
    state.invoices = await api('/api/invoices');
  } catch(e){
    state.invoices = [];
  }
}
async function loadAll(){
  await loadTables();
  await Promise.all([loadMenu(), loadWaiters(), loadOrders(), loadInvoices(), loadReservations(), loadWaiterReports()]);
}

function renderLogin(err){
  const savedEmail = localStorage.getItem('chit_admin_email') || '';
  const savedPass = localStorage.getItem('chit_admin_password') || '';
  const savedAutoLogin = localStorage.getItem('chit_admin_autologin') === 'true';

  const root = document.getElementById('root');
  root.innerHTML = '';
  root.appendChild(el(`<div class="login-wrap">
    <div class="login-box">
      <div class="login-brand">Chit</div>
      <div class="login-sub">Sign in to manage your restaurant</div>
      <label class="field-label">API server URL</label>

    API_BASE = root.querySelector('#li-api').value.trim().replace(/\/$/, '');
    const email = root.querySelector('#li-email').value.trim();
    const password = root.querySelector('#li-pass').value;
    const autoLoginChecked = root.querySelector('#li-autologin').checked;

    if(!email || !password){ renderLogin('Enter both email and password.'); return; }
    try{
      const resp = await api('/api/auth/login', { method:'POST', body: JSON.stringify({ email, password }) });
      authToken = resp.token;
      currentUser = resp.user;
      if(currentUser.role === 'waiter'){
        renderLogin('This admin panel is for restaurant admins.');
        authToken = null; currentUser = null;
        return;
      }

      if(autoLoginChecked){
        localStorage.setItem('chit_admin_email', email);
        localStorage.setItem('chit_admin_password', password);
        localStorage.setItem('chit_admin_autologin', 'true');
      }

      await loadAll();
      renderApp();
    } catch(e){
      renderLogin(e.message);
    }
  };

function render(isSilentRefresh = false){
  try {
    // If user is actively typing in an input or select, skip silent refresh to avoid flickering or closing dropdowns
    if(isSilentRefresh && document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)){
      return;
    }

    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.page===currentPage));
    positionNavHighlight();
    updateNavBadge();

    const main = document.getElementById('main');
    if(!main) return;

    let content;
    if(currentPage==='dashboard') content = renderDashboard();
    if(currentPage==='menu') content = renderMenu();
    if(currentPage==='tables') content = renderTables();
    if(currentPage==='orders') content = renderOrders();
    if(currentPage==='history') content = renderOrderHistory();
    if(currentPage==='waiters') content = renderWaiters();
    if(currentPage==='reports') content = renderReports();

    if(isSilentRefresh){
      const existingWrap = main.firstElementChild;
      if(existingWrap && content){
        existingWrap.className = '';
        existingWrap.replaceWith(content);
      } else {
        main.innerHTML = '';
        main.appendChild(content || el(`<div class="empty">Screen loading…</div>`));
      }
    } else {
      main.innerHTML = '';
      const wrap = el(`<div class="page-fade"></div>`);
      wrap.appendChild(content || el(`<div class="empty">Screen loading…</div>`));
      main.appendChild(wrap);
    }
  } catch(err) {
    if(!isSilentRefresh){
      console.error('Render error:', err);
      const main = document.getElementById('main');
      if(main){
        main.innerHTML = `<div class="panel" style="margin-top:20px"><div class="panel-title" style="color:var(--rust)">Error loading ${currentPage}</div><div style="color:var(--paper-dim);font-size:13px">${err.message}</div><button class="btn ghost" style="margin-top:14px" onclick="loadAll().then(()=>render(false))">Retry</button></div>`;
      }
    }
  }
}

function positionNavHighlight(){
  const active = document.querySelector('.nav-btn.active');
  const highlight = document.getElementById('navHighlight');
  if(active && highlight){ highlight.style.transform = `translateY(${active.offsetTop}px)`; }
}

function animateCount(elm, target, isMoney){
  if(!elm) return;
  const start = 0; const duration = 500; const startTime = performance.now();
  function tick(now){
    const p = Math.min((now-startTime)/duration, 1);
    const eased = 1 - Math.pow(1-p, 3);
    const val = start + (target-start)*eased;
    elm.textContent = isMoney ? money(val) : Math.round(val);
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function waiterName(id){ const w = state.waiters.find(w=>w.id===id); return w? w.name : 'Unassigned'; }

function orderTotal(o){
  if(!o) return { subtotal: 0, discount: 0, tax: 0, total: 0 };
  const items = o.items || [];
  const subtotal = items.reduce((s,it)=>s + (Number(it.price)||0)*(Number(it.qty)||Number(it.quantity)||1), 0);
  const discount = Number(o.discount) || Number(o.discount_amount) || 0;
  const taxable = Math.max(subtotal - discount, 0);
  const taxPct = Number(o.taxPct) || Number(o.tax_pct) || 5;
  const tax = taxable * (taxPct / 100);
  const total = taxable + tax;
  return { subtotal, discount, tax, total };
}

      const order = state.orders.find(o=>o.tableId===t.id && o.status==='open');

      else if(res) sub = `Reserved: ${res.customer_name} (${res.party_size}p)`;

            ? `<button class="btn small" data-act="seat" data-id="${t.id}" style="background:var(--leaf)">Seat guest</button>
               <button class="btn small" data-act="order" data-id="${t.id}">Take order</button>`
            : order
              ? `<button class="btn small" data-act="order" data-id="${t.id}" style="background:var(--brass)">+ Add Dish / Order</button>
                 <button class="btn small" data-act="bill" data-id="${order.id}" style="background:var(--leaf)">Bill (${money(orderTotal(order).total)})</button>`
              : `<button class="btn small" data-act="order" data-id="${t.id}">Take order</button>`
          }
          <button class="icon-btn" data-act="del" data-id="${t.id}">✕</button>

      </div>`);
      grid.appendChild(card);
    });
  }
  paint();

  wrap.querySelector('#res-open-btn').onclick = () => openReservationModal();
  wrap.querySelector('#tb-add').onclick = async ()=>{
    const num = parseInt(wrap.querySelector('#tb-num').value);
    const cap = parseInt(wrap.querySelector('#tb-cap').value) || 4;
    if(!num){ toast('Enter table number.', 'error'); return; }
    try{
      await api('/api/tables', { method:'POST', body: JSON.stringify({ tableNumber:num, capacity:cap }) });
      await loadTables(); toast(`Table ${num} added.`, 'success'); render();
    } catch(e){ toast(e.message, 'error'); }
  };

  grid.onclick = async (e)=>{
    const act = e.target.dataset.act;
    const id = parseInt(e.target.dataset.id);
    if(!act || !id) return;

    if(act==='seat'){
      try {
        const res = state.reservations.find(r=>r.table_id===id && r.status==='confirmed');
        if(res){
          await api(`/api/tables/reservations/${res.id}/status`, { method:'PATCH', body: JSON.stringify({ status:'seated' }) });
        } else {
          await api(`/api/tables/${id}/status`, { method:'PATCH', body: JSON.stringify({ status:'occupied' }) });
        }
        await loadAll(); render(); toast('Guest seated!');
      } catch(err){ toast(err.message, 'error'); }
    }
    if(act==='del'){
      const t = state.tables.find(t=>t.id===id);
      confirmAction(`Remove Table ${t.number}?`, async ()=>{
        try{ await api(`/api/tables/${t.id}`, { method:'DELETE' }); await loadTables(); toast('Table removed.'); render(); }
        catch(err){ toast(err.message, 'error'); }
      });
    }
    if(act==='order'){ openOrderModal(id); }
    if(act==='bill'){
      try {
        let inv;
        try { inv = await api(`/api/orders/${id}/invoice`, { method:'POST' }); }
        catch(err1){ inv = await api(`/api/invoices/generate/${id}`, { method:'POST' }); }
        openInvoiceModal(inv);
      } catch(e){ toast(e.message, 'error'); }
    }
  };
  return wrap;
}

function openOrderModal(tableId, orderId){
  let existing = null;
  if(orderId) existing = state.orders.find(o=>o.id===orderId);
  else if(tableId) existing = state.orders.find(o=>o.tableId===tableId && o.status==='open');

  if(existing){
    draftOrder = existing;
  } else {
    draftOrder = { id:null, tableId, tableNumber: tableId ? tableNumberFor(tableId) : 'Takeaway', waiterId:null, customerName:'', items:[], status:'open', taxPct: state.taxPct, discount:0 };
  }
  paintOrderModal();
  document.getElementById('orderModalOverlay').classList.add('show');
}
function closeOrderModal(){ document.getElementById('orderModalOverlay').classList.remove('show'); draftOrder=null; render(); }

async function refreshDraftOrder_setId(newId){
  await loadOrders();
  draftOrder = state.orders.find(o=>o.id===newId) || draftOrder;
}
async function refreshDraftOrder(){
  const id = draftOrder.id;
  await loadOrders();
  if(id){ draftOrder = state.orders.find(o=>o.id===id) || draftOrder; }
}

function paintOrderModal(){
  const o = draftOrder;
  const modal = document.getElementById('orderModal');
  const t = orderTotal(o);
  modal.innerHTML = '';
  modal.appendChild(el(`<div>
    <div class="modal-head">
      <div class="modal-title">Table ${o.tableNumber} — Quick Order</div>
      <button class="close-x" id="om-close">✕</button>
    </div>
    <div class="form-row">
      <select id="om-waiter" style="min-width:180px">
        <option value="">Assign waiter…</option>
        ${state.waiters.filter(w=>w.active).map(w=>`<option value="${w.id}" ${o.waiterId===w.id?'selected':''}>${w.name}</option>`).join('')}
      </select>
      <input id="om-customer" placeholder="Customer name" value="${o.customerName||''}" style="min-width:180px" />
    </div>

    <!-- COMPACT FAST SEARCH & ADD ITEM BAR -->
    <div class="panel-title" style="margin-top:12px;font-size:15px">Add Dish to Order</div>
    <div class="form-row" style="margin-bottom:16px; gap:8px">
      <select id="om-quick-select" style="flex:1">
        <option value="">🔍 Search / Select dish to add…</option>
        ${state.menuItems.filter(m=>m.available).map(m=>`<option value="${m.id}">${m.name} — ₹${m.price} (${m.category})</option>`).join('')}
      </select>
      <input id="om-quick-qty" type="number" value="1" min="1" style="width:70px;text-align:center" />
      <button class="btn" id="om-quick-add" style="background:var(--brass)">+ Add</button>
    </div>

    <div class="panel-title" style="margin-top:12px;font-size:15px">Current Items (${o.items.length})</div>
    <div id="om-items"></div>

    <div class="form-row" style="margin-top:12px">
      <label style="font-size:12px;color:var(--paper-dim)">Discount ₹</label>
      <input id="om-discount" type="number" value="${o.discount||0}" style="width:90px" />
      <label style="font-size:12px;color:var(--paper-dim)">Tax %</label>
      <input id="om-tax" type="number" value="${o.taxPct}" style="width:70px" />
    </div>
    <div class="order-total-bar">
      <div style="color:var(--paper-dim);font-size:13px">Subtotal ${money(t.subtotal)} · Tax ${money(t.tax)}${t.discount?` · Discount -${money(t.discount)}`:''}</div>
      <div class="order-total-num">${money(t.total)}</div>
    </div>
    <div class="form-row" style="justify-content:space-between;margin-top:16px">
      ${o.id ? `<button class="btn danger" id="om-cancel-order">Cancel order</button>` : `<div></div>`}
      <div>
        <button class="btn ghost" id="om-cancel">Close</button>
        ${o.id ? `<button class="btn ghost" id="om-print-kot" style="border-color:var(--brass);color:var(--brass)">🖨️ Print KOT</button>` : ''}
        <button class="btn" id="om-invoice" style="background:var(--leaf)">Generate Invoice</button>
      </div>
    </div>
  </div>`));

  modal.querySelector('#om-close').onclick = closeOrderModal;
  modal.querySelector('#om-cancel').onclick = closeOrderModal;
  if(modal.querySelector('#om-print-kot')){
    modal.querySelector('#om-print-kot').onclick = ()=> printKOT(o);
  }
  modal.querySelector('#om-waiter').onchange = (e)=>{ o.waiterId = parseInt(e.target.value)||null; };
  modal.querySelector('#om-customer').oninput = (e)=>{ o.customerName = e.target.value; };
  modal.querySelector('#om-discount').oninput = (e)=>{ o.discount = parseFloat(e.target.value)||0; paintOrderModal(); };
  modal.querySelector('#om-tax').oninput = (e)=>{ o.taxPct = parseFloat(e.target.value)||0; paintOrderModal(); };

  modal.querySelector('#om-quick-add').onclick = async ()=>{
    const itemId = parseInt(modal.querySelector('#om-quick-select').value);
    const qty = parseInt(modal.querySelector('#om-quick-qty').value) || 1;
    if(!itemId){ toast('Select a dish first.', 'error'); return; }

    try {
      if(!draftOrder.id){
        const body = { tableId: draftOrder.tableId, customerName: draftOrder.customerName || undefined, taxPct: draftOrder.taxPct, discount: draftOrder.discount, items:[{ menuItemId:itemId, quantity:qty }] };
        if(draftOrder.waiterId) body.waiterId = draftOrder.waiterId;
        const resp = await api('/api/orders', { method:'POST', body: JSON.stringify(body) });
        await loadTables();
        await refreshDraftOrder_setId(resp.id);
        toast('Order started.', 'success');
      } else {
        await api(`/api/orders/${draftOrder.id}/items`, { method:'PATCH', body: JSON.stringify({ add:{ menuItemId:itemId, quantity:qty } }) });
        await refreshDraftOrder();
      }
      paintOrderModal();
    } catch(err){ toast(err.message, 'error'); }
  };

  const itemsBox = modal.querySelector('#om-items');
  if(!o.items.length){ itemsBox.appendChild(el(`<div class="empty">No items in order — select a dish above to add.</div>`)); }
  o.items.forEach(it=>{
    const row = el(`<div class="menu-pick-row">
      <div class="menu-pick-name">${it.name} <span style="color:var(--paper-dim)">(${money(it.price)})</span></div>
      <div class="qty-ctrl">
        <button data-dec="${it.orderItemId}">−</button>
        <span>${it.qty}</span>
        <button data-inc="${it.orderItemId}">+</button>
      </div>
    </div>`);
    itemsBox.appendChild(row);
  });

  itemsBox.onclick = async (e)=>{
    const incId = parseInt(e.target.dataset.inc);
    const decId = parseInt(e.target.dataset.dec);
    if(incId){
      const it = o.items.find(i=>i.orderItemId===incId);
      await api(`/api/orders/${o.id}/items`, { method:'PATCH', body: JSON.stringify({ add:{ menuItemId: it.menuItemId, quantity: 1 } }) });
      await refreshDraftOrder(); paintOrderModal();
    }
    if(decId){
      const it = o.items.find(i=>i.orderItemId===decId);
      await api(`/api/orders/${o.id}/items`, { method:'PATCH', body: JSON.stringify({ remove: { orderItemId: decId } }) });
      await refreshDraftOrder(); paintOrderModal();
    }
  };

  if(modal.querySelector('#om-cancel-order')){
    modal.querySelector('#om-cancel-order').onclick = ()=>{
      confirmAction(`Cancel Order #${o.id}?`, async ()=>{
        try{
          await api(`/api/orders/${o.id}/cancel`, { method:'POST' });
          closeOrderModal();
          toast('Order cancelled.', 'error');
        } catch(err){ toast(err.message, 'error'); }
      });
    };
  }

  modal.querySelector('#om-invoice').onclick = async ()=>{
    if(!o.items.length){ toast('Add at least one item before billing.', 'error'); return; }
    try{
      let inv;
      try {
        inv = await api(`/api/orders/${o.id}/invoice`, { method:'POST' });
      } catch(e1) {
        inv = await api(`/api/invoices/generate/${o.id}`, { method:'POST' });
      }
      closeOrderModal();
      openInvoiceModal(inv);
    } catch(e){ toast(e.message, 'error'); }
  };
}

  modal.appendChild(el(`<div>

      </table>
      <div class="invoice-totals">
        <div><span>Subtotal</span><span>${money(invoice.subtotal)}</span></div>
        ${Number(invoice.discount) > 0 ? `<div><span>Discount</span><span>-${money(invoice.discount)}</span></div>` : ''}
        <div><span>Tax (${invoice.tax_pct || invoice.taxPct || 5}%)</span><span>+${money(invoice.tax)}</span></div>

      </div>

    <div class="form-row" style="justify-content:space-between;margin-top:16px">
      <select id="inv-pay-method" style="min-width:180px">
        <option value="cash">💵 Cash Payment</option>
        <option value="upi">💳 UPI / Online at Desk (Razorpay)</option>
        <option value="card">💳 Credit/Debit Card</option>
      </select>
      <div>
        <button class="btn ghost" onclick="window.print()">🖨️ Print Receipt</button>
        <button class="btn" id="inv-paid-btn" style="background:var(--leaf)">Mark as Paid</button>
      </div>
    </div>
  </div>`));

  document.getElementById('invoiceModalOverlay').classList.add('show');
  modal.querySelector('#inv-close').onclick = ()=> document.getElementById('invoiceModalOverlay').classList.remove('show');

  const paidBtn = modal.querySelector('#inv-paid-btn');
  paidBtn.onclick = async ()=>{
    paidBtn.disabled = true;
    const method = modal.querySelector('#inv-pay-method').value;

    if(method === 'upi' && window.Razorpay){
      try {
        const orderData = await api('/api/payments/create-order', {
          method: 'POST',
          body: JSON.stringify({ amount: Math.round(invoice.total * 100), invoiceId: invoice.id })
        });
        const options = {
          key: orderData.keyId || 'rzp_test_TLZYM415Yn2Pbr',
          amount: orderData.amount,
          currency: 'INR',
          name: 'Chit Restaurant',
          order_id: orderData.orderId,
          handler: async function (res) {
            await api('/api/payments/verify-payment', {
              method: 'POST',
              body: JSON.stringify({
                razorpay_order_id: res.razorpay_order_id,
                razorpay_payment_id: res.razorpay_payment_id,
                razorpay_signature: res.razorpay_signature,
                invoiceId: invoice.id,
                paymentMethod: 'upi'
              })
            });
            await loadAll(); render();
            document.getElementById('invoiceModalOverlay').classList.remove('show');
            toast('Online UPI Payment Verified!', 'success');
          }
        };
        const rzp = new window.Razorpay(options);
        rzp.open();
        return;
      } catch(e){ console.warn(e); }
    }

    try{
      await api(`/api/invoices/${invoice.id}/pay`, { method:'PATCH', body: JSON.stringify({ paymentMethod: method }) });
      await loadAll(); render();
      document.getElementById('invoiceModalOverlay').classList.remove('show');
      toast(`Invoice settled via ${method.toUpperCase()}.`, 'success');
    } catch(err){ toast(err.message, 'error'); } finally { paidBtn.disabled = false; }
  };
}

      <div class="modal-title">Settle Order #${order.id}</div>

        <button class="btn" data-pm="upi" style="background:var(--brass);padding:12px 16px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px">💳 UPI / PhonePe / Google Pay</button>
        <button class="btn" data-pm="card" style="background:var(--panel-raised);border:1px solid var(--line);padding:12px 16px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px">💳 Credit / Debit Card</button>
      </div>
    </div>
  </div>`;

  document.getElementById('invoiceModalOverlay').classList.add('show');

  modal.querySelectorAll('button[data-pm]').forEach(btn => {
    btn.onclick = async () => {
      const method = btn.dataset.pm;
      modal.querySelectorAll('button').forEach(b => b.disabled = true);
      try {
        let inv;
        try { inv = await api(`/api/orders/${order.id}/invoice`, { method: 'POST' }); }
        catch(e){ inv = await api(`/api/invoices/generate/${order.id}`, { method: 'POST' }); }
        
        await api(`/api/invoices/${inv.id}/pay`, { method: 'PATCH', body: JSON.stringify({ paymentMethod: method }) });

        modal.querySelectorAll('button').forEach(b => b.disabled = false);
      }
    };
  });
}

/* ---------------- LIVE ORDERS SCREEN (1s REALTIME REFRESH) ---------------- */
function renderOrders(){
  // Live active orders are strictly open or billed
  let list = state.orders.filter(o => o.status === 'open' || o.status === 'billed');
  const openOrdersCount = list.filter(o=>o.status==='open').length;
  const billedOrdersCount = list.filter(o=>o.status==='billed').length;

  const wrap = el(`<div>
    <div class="page-head">
      <div><div class="page-title">Live Kitchen & Table Orders</div><div class="page-sub">Live 1-second auto-sync with kitchen thermal printing</div></div>
      <div style="display:flex;gap:10px;align-items:center">
        ${openOrdersCount > 0 ? `<button class="btn small" id="ord-mark-all-paid" style="background:var(--leaf)">Mark All Open as Paid (${openOrdersCount})</button>` : ''}
        <div class="filter-tabs" id="ord-tabs">
          <button class="filter-tab ${orderFilter==='all'?'active':''}" data-f="all">All Live (${list.length})</button>
          <button class="filter-tab ${orderFilter==='open'?'active':''}" data-f="open">Open (${openOrdersCount})</button>
          <button class="filter-tab ${orderFilter==='billed'?'active':''}" data-f="billed">Billed (${billedOrdersCount})</button>
        </div>
      </div>
    </div>
    <div class="panel">
      <table>
        <thead><tr><th>Order #</th><th>Type</th><th>Table/Guest</th><th>Items</th><th>Total</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="ord-body"></tbody>
      </table>
    </div>
  </div>`);

  if(wrap.querySelector('#ord-mark-all-paid')){
    wrap.querySelector('#ord-mark-all-paid').onclick = ()=>{
      confirmAction(`Mark all ${openOrdersCount} open orders as Paid?`, async ()=>{
        try {
          const openOrders = list.filter(o=>o.status==='open');
          for(const o of openOrders){
            try {
              let inv;
              try { inv = await api(`/api/orders/${o.id}/invoice`, { method:'POST' }); }
              catch(e){ inv = await api(`/api/invoices/generate/${o.id}`, { method:'POST' }); }
              await api(`/api/invoices/${inv.id}/pay`, { method:'PATCH', body: JSON.stringify({ paymentMethod: 'cash' }) });
            } catch(err){}
          }
          await loadAll(); render(); toast(`All ${openOrdersCount} open orders marked as Paid!`, 'success');
        } catch(err){ toast(err.message, 'error'); }
      });
    };
  }

  wrap.querySelector('#ord-tabs').onclick = (e)=>{
    if(e.target.dataset.f){ orderFilter = e.target.dataset.f; render(); }
  };

  const body = wrap.querySelector('#ord-body');
  let filtered = list;
  if(orderFilter !== 'all') filtered = list.filter(o=>o.status===orderFilter);

  if(!filtered.length){
    body.appendChild(el(`<tr><td colspan="7" class="empty">No live ${orderFilter !== 'all' ? orderFilter : ''} orders right now.</td></tr>`));
  } else {
    filtered.forEach(o=>{
      const t = orderTotal(o);
      const itemsCount = (o.items || []).length;
      const isOpen = o.status === 'open';

      const row = el(`<tr>
        <td>#${o.id}</td>
        <td><span class="pill wait">${o.orderType||'dine_in'}</span></td>
        <td>${o.tableNumber && o.tableNumber !== '?' ? 'Table '+o.tableNumber : (o.customerName||'Takeaway')}</td>
        <td>${itemsCount} dish(es)</td>
        <td style="color:var(--brass);font-weight:700">${money(t.total)}</td>
        <td><span class="pill ${o.status==='billed'?'wait':'off'}">${o.status}</span></td>
        <td>
          <button class="btn small" data-act="open" data-id="${o.id}">Open</button>
          <button class="btn small" data-act="kot" data-id="${o.id}" style="background:var(--panel-raised);border:1px solid var(--brass);color:var(--brass);margin-left:4px">🖨️ KOT</button>
          ${isOpen ? `<button class="btn small" data-act="bill" data-id="${o.id}" style="background:var(--brass);margin-left:4px">Mark Billed</button>` : ''}
          <button class="btn small" data-act="pay" data-id="${o.id}" style="background:var(--leaf);margin-left:4px">Mark Paid</button>
        </td>
      </tr>`);

      row.onclick = async (e)=>{
        const act = e.target.dataset.act;
        if(!act) return;
        if(act === 'open'){ openOrderModal(o.tableId, o.id); }
        if(act === 'kot'){ printKOT(o); }
        if(act === 'bill'){
          try {
            e.target.disabled = true;
            try { await api(`/api/orders/${o.id}/invoice`, { method:'POST' }); }
            catch(err1){ await api(`/api/invoices/generate/${o.id}`, { method:'POST' }); }
            await loadAll(); render();
            toast(`Order #${o.id} marked as Billed!`, 'success');
          } catch(err){ toast(err.message, 'error'); }
        }
        if(act === 'pay'){
          promptPaymentMethod(o);
        }
      };

      body.appendChild(row);
    });
  }

  return wrap;
}

  const totalPastRevenue = pastOrders.filter(o=>o.status==='paid').reduce((s,o)=>s+orderTotal(o).total,0);

  const wrap = el(`<div>
    <div class="page-head">
      <div><div class="page-title">Past Order History</div><div class="page-sub">Archive of all completed and paid bills</div></div>
      <div style="font-family:'Zilla Slab',serif;font-size:22px;color:var(--leaf);font-weight:700">Total Settled: ${money(totalPastRevenue)}</div>
    </div>
    <div class="panel">
      <table>
        <thead><tr><th>Order #</th><th>Type</th><th>Table/Guest</th><th>Items</th><th>Total</th><th>Status</th><th>Action</th></tr></thead>
        <tbody>
          ${!pastOrders.length 
            ? `<tr><td colspan="7" class="empty">No past orders in history.</td></tr>`
            : pastOrders.map(o => {
                const t = orderTotal(o);
                const itemsCount = (o.items || []).length;
                return `<tr>
                  <td>#${o.id}</td>
                  <td><span class="pill wait">${o.orderType||'dine_in'}</span></td>
                  <td>${o.tableNumber && o.tableNumber !== '?' ? 'Table '+o.tableNumber : (o.customerName||'Takeaway')}</td>
                  <td>${itemsCount} dish(es)</td>
                  <td style="color:var(--brass);font-weight:700">${money(t.total)}</td>
                  <td><span class="pill ${o.status==='paid'?'on':'off'}">${o.status}</span></td>
                  <td><button class="btn small" data-hopen="${o.id}" data-htable="${o.tableId}">View Bill</button></td>
                </tr>`;
              }).join('')
          }
        </tbody>
      </table>
    </div>
  </div>`);

  wrap.onclick = (e)=>{
    const hId = parseInt(e.target.dataset.hopen);
    const hTable = parseInt(e.target.dataset.htable) || null;
    if(hId){ openOrderModal(hTable, hId); }
  };

  return wrap;
}

/* ---------------- WAITERS & STAFF PUNCH REPORT ---------------- */
function renderWaiters(){
  const wrap = el(`<div>
    <div class="page-head">
      <div><div class="page-title">Staff & Attendance</div><div class="page-sub">Manage waiter accounts, login credentials, and track live attendance</div></div>
    </div>
    
    <div class="panel">
      <div class="panel-title">Add New Waiter Staff Account</div>
      <div class="form-row">
        <input id="w-name" placeholder="Full Name (e.g. Subham Waiter)" />
        <input id="w-email" placeholder="Email (Login)" style="width:220px" />
        <input id="w-pass" placeholder="Password" type="password" style="width:160px" />
        <button class="btn" id="w-add">Add Staff</button>
      </div>
    </div>

    <!-- EXISTING STAFF ACCOUNTS LIST -->
    <div class="panel">
      <div class="panel-title">Existing Staff Accounts (${state.waiters.length})</div>
      <table>
        <thead><tr><th>Staff Name</th><th>Email (Login)</th><th>Status</th><th>Role</th><th>Action</th></tr></thead>
        <tbody>
          ${!state.waiters.length 
            ? `<tr><td colspan="5" class="empty">No waiter staff registered yet. Add a staff account above.</td></tr>`
            : state.waiters.map(w => `<tr>
                <td><b>${w.name}</b></td>
                <td><span style="font-family:'Space Mono',monospace;color:var(--brass)">${w.email}</span></td>
                <td><span class="pill ${w.active ? 'on' : 'off'}">${w.active ? 'Active' : 'Disabled'}</span></td>
                <td style="color:var(--paper-dim)">Waitstaff</td>
                <td><button class="btn danger small" data-wdel="${w.id}">Remove</button></td>
              </tr>`).join('')
          }
        </tbody>
      </table>
    </div>

    <!-- TODAY'S STAFF ATTENDANCE & LATE PUNCH TRACKING -->
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div>
          <div class="panel-title" style="margin-bottom:2px">Today's Staff Shift Attendance (${new Date().toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })})</div>
          <div style="font-size:12px;color:var(--paper-dim)">Restaurant Opening: <b>11:00 AM</b> · Grace Period: <b>10 mins (Till 11:10 AM)</b></div>
        </div>
        <span style="font-size:11px;background:var(--brass-dim);color:var(--brass);padding:4px 10px;border-radius:var(--radius-full);font-weight:700">Strict 1 Punch Per Day</span>
      </div>

      <table>
        <thead>
          <tr>
            <th>Waiter Staff</th>
            <th>Punctuality Status</th>
            <th>Punch In Time</th>
            <th>Punch Out Time</th>
            <th>Today's Active Hours</th>
            <th>Orders Handled</th>
            <th>Sales Generated</th>
          </tr>
        </thead>
        <tbody>
          ${!state.waiterReports.length
            ? `<tr><td colspan="7" class="empty">No staff attendance logs recorded yet.</td></tr>`
            : state.waiterReports.map(wr => {
                const todayStr = new Date().toDateString();
                const todayPunch = (wr.recentPunches || []).find(p => new Date(p.punch_in).toDateString() === todayStr);

                let statusBadge = `<span class="pill off" style="background:rgba(255,255,255,0.06);color:var(--paper-dim);border:1px solid var(--line)">⚪ Not Punched In Today</span>`;
                let punchInStr = '--:--';
                let punchOutStr = '--:--';

                if(todayPunch){
                  const pInDate = new Date(todayPunch.punch_in);
                  punchInStr = pInDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });

                  // Check Opening Cutoff (11:00 AM & 11:10 AM Grace)
                  const openCutoff = new Date(pInDate);
                  openCutoff.setHours(11, 0, 0, 0);

                  const graceCutoff = new Date(pInDate);
                  graceCutoff.setHours(11, 10, 0, 0);

                  if(pInDate <= graceCutoff){
                    statusBadge = `<span class="pill on" style="background:var(--leaf-bg);color:var(--leaf);border:1px solid rgba(16,185,129,0.3)">🟢 On Time</span>`;
                  } else {
                    const minsLate = Math.ceil((pInDate.getTime() - openCutoff.getTime()) / 60000);
                    statusBadge = `<span class="pill off" style="background:rgba(239,68,68,0.18);color:var(--rust);border:1px solid rgba(239,68,68,0.4)">⚠️ Late (${minsLate} min late)</span>`;
                  }

                  if(todayPunch.punch_out){
                    punchOutStr = new Date(todayPunch.punch_out).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
                  } else if(wr.isPunchedIn) {
                    punchOutStr = `<span style="color:var(--leaf);font-weight:700">🟢 On Floor (Active)</span>`;
                  } else {
                    punchOutStr = `<span style="color:var(--paper-dim)">Shift Completed</span>`;
                  }
                }

                return `<tr>
                  <td><b>${wr.waiter.name}</b></td>
                  <td>${statusBadge}</td>
                  <td style="font-weight:700;color:${todayPunch ? 'var(--leaf)' : 'var(--paper-dim)'}">⏰ ${punchInStr}</td>
                  <td style="font-weight:700">🏁 ${punchOutStr}</td>
                  <td><b>${todayPunch ? ((todayPunch.total_minutes || Math.max(1, Math.floor((Date.now() - new Date(todayPunch.punch_in).getTime())/60000))) / 60).toFixed(1) : '0.0'} hrs</b></td>
                  <td>${wr.totalOrders} orders</td>
                  <td style="color:var(--brass);font-weight:700">${money(wr.totalRevenue)}</td>
                </tr>`;
              }).join('')
          }
        </tbody>
      </table>
    </div>
  </div>`);

  wrap.querySelector('#w-add').onclick = async ()=>{
    const name = wrap.querySelector('#w-name').value.trim();
    const email = wrap.querySelector('#w-email').value.trim();
    const password = wrap.querySelector('#w-pass').value;
    if(!name || !email || !password){ toast('All fields required.', 'error'); return; }
    try{
      await api('/api/waiters', { method:'POST', body: JSON.stringify({ name, email, password }) });
      await loadAll(); render(); toast('Staff account created!', 'success');
    } catch(e){ toast(e.message, 'error'); }
  };

  wrap.onclick = (e)=>{
    const delId = parseInt(e.target.dataset.wdel);
    if(delId){
      const w = state.waiters.find(x=>x.id===delId);
      confirmAction(`Remove staff account "${w?.name}"?`, async ()=>{
        try {
          await api(`/api/waiters/${delId}`, { method:'DELETE' });
          await loadAll(); render(); toast('Staff account removed.');
        } catch(err){ toast(err.message, 'error'); }
      });
    }
  };

  return wrap;
}

/* ---------------- REPORTS & PAYMENT BREAKDOWN ---------------- */
function renderReports(){
  const paid = state.orders.filter(o=>o.status==='paid');
  const totalRevenue = paid.reduce((s,o)=>s+orderTotal(o).total,0);

  let upiRev = 0, cashRev = 0, cardRev = 0;
  paid.forEach(o => {
    const t = orderTotal(o).total;
    const inv = (state.invoices || []).find(i => Number(i.order_id) === Number(o.id));
    const pm = (inv?.payment_method || o.paymentMethod || o.payment_method || 'cash').toLowerCase();
    if(pm.includes('upi') || pm.includes('online')) upiRev += t;
    else if(pm.includes('card')) cardRev += t;
    else cashRev += t;
  });

  const wrap = el(`<div>
    <div class="page-head">
      <div><div class="page-title">Financial Reports</div><div class="page-sub">Revenue breakdown by payment gateway & payment options</div></div>
    </div>
    <div class="stat-row">
      <div class="stat-card"><div class="stat-num">${money(totalRevenue)}</div><div class="stat-label">Total Revenue</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--leaf)">${money(upiRev)}</div><div class="stat-label">💳 UPI / Online</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--brass)">${money(cashRev)}</div><div class="stat-label">💵 Cash</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--paper)">${money(cardRev)}</div><div class="stat-label">💳 Card / Other</div></div>
    </div>
    <div class="panel">
      <div class="panel-title">Staff Sales & Shift Attendance Performance</div>
      <table>
        <thead>
          <tr>
            <th>Staff Member</th>
            <th>Today's Attendance</th>
            <th>Punch In Time</th>
            <th>Punch Out Time</th>
            <th>Active Shift Hours</th>
            <th>Orders Handled</th>
            <th>Total Sales Revenue</th>
          </tr>
        </thead>
        <tbody>
          ${!state.waiterReports.length
            ? `<tr><td colspan="7" class="empty">No staff performance logs recorded yet.</td></tr>`
            : state.waiterReports.map(wr => {
                const todayStr = new Date().toDateString();
                const todayPunch = (wr.recentPunches || []).find(p => new Date(p.punch_in).toDateString() === todayStr);

                let statusBadge = `<span class="pill off" style="background:rgba(255,255,255,0.06);color:var(--paper-dim);border:1px solid var(--line)">⚪ Not Punched In Today</span>`;
                let punchInStr = '--:--';
                let punchOutStr = '--:--';

                if(todayPunch){
                  const pInDate = new Date(todayPunch.punch_in);
                  punchInStr = pInDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });

                  const openCutoff = new Date(pInDate);
                  openCutoff.setHours(11, 0, 0, 0);

                  const graceCutoff = new Date(pInDate);
                  graceCutoff.setHours(11, 10, 0, 0);

                  if(pInDate <= graceCutoff){
                    statusBadge = `<span class="pill on" style="background:var(--leaf-bg);color:var(--leaf);border:1px solid rgba(16,185,129,0.3)">🟢 On Time</span>`;
                  } else {
                    const minsLate = Math.ceil((pInDate.getTime() - openCutoff.getTime()) / 60000);
                    statusBadge = `<span class="pill off" style="background:rgba(239,68,68,0.18);color:var(--rust);border:1px solid rgba(239,68,68,0.4)">⚠️ Late (${minsLate} min late)</span>`;
                  }

                  if(todayPunch.punch_out){
                    punchOutStr = new Date(todayPunch.punch_out).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
                  } else if(wr.isPunchedIn) {
                    punchOutStr = `<span style="color:var(--leaf);font-weight:700">🟢 On Floor (Active)</span>`;
                  } else {
                    punchOutStr = `<span style="color:var(--paper-dim)">Shift Completed</span>`;
                  }
                }

                return `<tr>
                  <td><b>${wr.waiter.name}</b></td>
                  <td>${statusBadge}</td>
                  <td style="font-weight:700;color:${todayPunch ? 'var(--leaf)' : 'var(--paper-dim)'}">⏰ ${punchInStr}</td>
                  <td style="font-weight:700">🏁 ${punchOutStr}</td>
                  <td><b>${todayPunch ? ((todayPunch.total_minutes || Math.max(1, Math.floor((Date.now() - new Date(todayPunch.punch_in).getTime())/60000))) / 60).toFixed(1) : '0.0'} hrs</b></td>
                  <td>${wr.totalOrders} orders (${wr.dineInOrders} Dine-In / ${wr.takeawayOrders} Takeaway)</td>
                  <td style="color:var(--brass);font-weight:700">${money(wr.totalRevenue)}</td>

/* ============================================================
   Boot
============================================================ */
async function bootApp(){
  const savedEmail = localStorage.getItem('chit_admin_email');
  const savedPass = localStorage.getItem('chit_admin_password');
  const savedAutoLogin = localStorage.getItem('chit_admin_autologin') === 'true';

  if(savedAutoLogin && savedEmail && savedPass){
    try {
      const resp = await api('/api/auth/login', { method:'POST', body: JSON.stringify({ email: savedEmail, password: savedPass }) });
      authToken = resp.token;
      currentUser = resp.user;
      if(currentUser.role !== 'waiter'){
        await loadAll();
        renderApp();
        return;
      }
    } catch(e){}
  }
  renderLogin();
}
bootApp();
